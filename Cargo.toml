[package]
authors = ["Clover You <hi@clovu.me>"]
categories = [
  "command-line-utilities",
  "development-tools",
  "development-tools::cargo-plugins",
  "filesystem",
]
description = "Clean Cargo target directories across Rust projects to reclaim disk space."
documentation = "https://github.com/clovu/cargo-clean-global#readme"
edition = "2024"
exclude = [
  "/.DS_Store",
  "/.editorconfig",
  "/.github/",
  "/.gitignore",
  "/.vscode/",
  "/target/",
]
homepage = "https://github.com/clovu/cargo-clean-global"
keywords = ["cargo", "clean", "target", "disk", "cache"]
license = "MIT"
name = "cargo-clean-global"
readme = "README.md"
repository = "https://github.com/clovu/cargo-clean-global"
version = "1.2.6"

[[bin]]
name = "cargo-clean-global"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dirs-next = "2.0.0"
indicatif = "0.18.4"
toml = "1.1.2"
